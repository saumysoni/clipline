  <!-- Settings: the account, connected channels and appearance -->
  <section id="s8" hidden>
    <div class="work">
      <div class="page-head">
        <div>
          <div class="eyebrow">Settings</div>
          <h1>Settings</h1>
          <p class="lede">Your account, the channels Pit Crew posts to, and how Pit Crew looks.</p>
        </div>
      </div>
      <div class="card set-card" id="setAccount">
        <h2>Account</h2>
        <div class="set-row"><span class="ms" aria-hidden="true">account_circle</span><span class="set-t"><b id="setEmail"></b><small>Signed in</small></span>
          <span class="set-acts"><button type="button" class="linkbtn" id="setPass">Change password</button><button type="button" class="linkbtn" id="logoutBtn">Sign out</button></span></div>
        <div class="ok-note" id="setPassOk" role="status"></div>
      </div>
      <div class="card set-card">
        <h2>YouTube channels</h2>
        <div id="setYt"></div>
      </div>
      <div class="card set-card">
        <h2>Instagram accounts</h2>
        <div id="setIg"></div>
      </div>
      <div class="card set-card">
        <h2>Appearance</h2>
        <div class="set-row"><span class="ms" aria-hidden="true">contrast</span><span class="set-t"><b>Light or dark</b><small>Remembered on this device</small></span>
          <div class="theme-seg" role="group" aria-label="Appearance">
            <button type="button" data-theme-set="light" aria-pressed="false"><span class="ms" aria-hidden="true">light_mode</span>Light</button>
            <button type="button" data-theme-set="auto" aria-pressed="false"><span class="ms" aria-hidden="true">contrast</span>Auto</button>
            <button type="button" data-theme-set="dark" aria-pressed="false"><span class="ms" aria-hidden="true">dark_mode</span>Dark</button>
          </div></div>
      </div>
    </div>
  </section>
