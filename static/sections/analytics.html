  <!-- Analytics: how the creator's Shorts are doing -->
  <section id="s6" hidden>
    <div class="work wide an-root">
      <div class="page-head">
        <div>
          <div class="eyebrow">Analytics</div>
          <h1 id="anH">How your Shorts are doing</h1>
          <p class="lede" id="anLede">Your Shorts and Reels, not only the ones Pit Crew made.</p>
        </div>
        <button class="ghost" id="anRefresh" type="button"><span class="ms" aria-hidden="true">refresh</span>Refresh</button>
      </div>

      <div class="an-filters" role="group" aria-label="What to show">
        <div class="an-seg" id="anRange" role="group" aria-label="Time range">
          <button type="button" data-days="7">7 days</button>
          <button type="button" data-days="28" aria-pressed="true">28 days</button>
          <button type="button" data-days="90">90 days</button>
          <button type="button" data-days="365">Year</button>
          <button type="button" data-days="0">All time</button>
          <button type="button" data-days="custom">Custom</button>
        </div>
        <div class="an-custom" id="anCustom" hidden>
          <input type="date" id="anFrom" aria-label="From"><span>to</span><input type="date" id="anTo" aria-label="To">
          <button type="button" class="ghost sm" id="anApply">Apply</button>
        </div>
        <div class="an-seg" id="anContent" role="group" aria-label="Which videos">
          <button type="button" data-c="shorts" aria-pressed="true">Shorts</button>
          <button type="button" data-c="videos">Videos</button>
          <button type="button" data-c="all">All</button>
        </div>
        <div class="an-seg" id="anPlat" role="group" aria-label="Platform">
          <button type="button" data-p="" aria-pressed="true">All</button>
          <button type="button" data-p="youtube">YouTube</button>
          <button type="button" data-p="instagram">Instagram</button>
        </div>
        <select id="anVlog" aria-label="Vlog"><option value="">All vlogs</option></select>
        <span class="an-asof" id="anAsof"></span>
      </div>

      <div class="ptabs an-tabs" role="tablist" id="anTabs" aria-label="Analytics">
        <button type="button" role="tab" data-tab="overview" aria-controls="anPanOverview" aria-selected="true"><span class="ms" aria-hidden="true">dashboard</span>Overview</button>
        <button type="button" role="tab" data-tab="compare" aria-controls="anPanCompare" aria-selected="false" tabindex="-1"><span class="ms" aria-hidden="true">stacked_line_chart</span>Compare</button>
        <button type="button" role="tab" data-tab="audience" aria-controls="anPanAudience" aria-selected="false" tabindex="-1"><span class="ms" aria-hidden="true">groups</span>Audience</button>
        <button type="button" role="tab" data-tab="instagram" aria-controls="anPanInsta" aria-selected="false" tabindex="-1"><span class="ms" aria-hidden="true">photo_camera</span>Instagram</button>
      </div>

      <div id="anPanCompare" role="tabpanel" hidden><div id="anCmpBox" aria-live="polite"></div></div>
      <div id="anPanAudience" role="tabpanel" hidden><div id="anAudBox" aria-live="polite"></div></div>
      <div id="anPanInsta" role="tabpanel" hidden><div id="anIgBox" aria-live="polite"></div></div>
      <div id="anPanOverview" role="tabpanel">
      <div id="anWeek" aria-live="polite"></div>
      <div id="anClips" aria-live="polite"></div>

      <div class="banner warn" id="anNote" role="status" hidden></div>
      <div id="anBody" aria-live="polite"></div>
      <div id="anVlogs" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <dialog id="anDetail" aria-labelledby="anDTitle">
    <button type="button" class="an-x" id="anDClose" aria-label="Close"><span class="ms" aria-hidden="true">close</span></button>
    <div id="anDBody"></div>
  </dialog>
