<div class="auth" id="auth" hidden>
  <form class="auth-card" id="authForm" novalidate>
    <div class="brand" aria-label="Pit Crew"><span class="brand-logo" aria-hidden="true"><svg class="logo" viewBox="0 0 48 32"><defs><linearGradient id="pcRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF3D63"/><stop offset=".55" stop-color="#E8002D"/><stop offset="1" stop-color="#A8001F"/></linearGradient><pattern id="pcCheck" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#fff"/><rect x="2" y="2" width="2" height="2" fill="#fff"/></pattern><clipPath id="pcTile"><path d="M17 3h22a8 8 0 0 1 8 8v10a8 8 0 0 1-8 8H17a8 8 0 0 1-8-8V11a8 8 0 0 1 8-8z" transform="skewX(-9) translate(5 0)"/></clipPath></defs><g class="speed" stroke="currentColor" stroke-linecap="round" stroke-width="2.4"><line x1="1.5" y1="10" x2="9" y2="10"/><line x1="4" y1="16" x2="10" y2="16"/><line x1="1.5" y1="22" x2="9" y2="22"/></g><g clip-path="url(#pcTile)"><rect x="6" y="0" width="44" height="32" fill="url(#pcRed)"/><rect x="38" y="20" width="12" height="12" fill="url(#pcCheck)" opacity=".38"/><rect class="shine" x="-20" y="0" width="10" height="32" fill="#fff" opacity=".22" transform="skewX(-20)"/></g><path d="M25.5 10.2 35 16l-9.5 5.8z" fill="#fff"/></svg></span><span class="wm">Pit<b>Crew</b></span></div>
    <h1 id="authTitle">Sign in</h1>
    <p class="lede" id="authLede">Turn one vlog into a week of Shorts.</p>
    <a class="ghost" id="googleBtn" href="/api/auth/google"><svg class="gmark" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</a>
    <div class="auth-or" id="authOr">OR</div>
    <label id="nameRow" hidden>Your name <input id="authName" type="text" autocomplete="name" maxlength="100" placeholder="Optional"></label>
    <label>Email <input id="authEmail" type="email" autocomplete="email" required maxlength="200"></label>
    <label>Password <input id="authPass" type="password" autocomplete="current-password" required minlength="8" maxlength="200"></label>
    <div class="err" id="authErr" role="alert"></div>
    <button class="primary" id="authGo" type="submit">Sign in</button>
    <p class="switch" id="authSwitchRow"><span id="authSwitchText">New to Pit Crew?</span> <button type="button" class="linkbtn" id="authSwitch">Create an account</button></p>
  </form>
</div>
